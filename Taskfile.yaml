version: "3"

tasks:
  run:
    desc: Run the DNS updater (dry-run with example config)
    cmds:
      - go run . --config {{.CLI_ARGS | default "config.yaml.example"}}

  build:
    desc: Build the Go binary
    cmds:
      - go build -o updater .

  test:
    desc: Run tests
    cmds:
      - go test -count=1 .

  testv:
    desc: Run tests verbose
    cmds:
      - go test -v -count=1 .

  lint:
    desc: Run linting
    cmds:
      - go vet ./...
      - go fix ./...

  golangci:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  docker:
    desc: Build Docker image
    cmds:
      - docker build -t cloudflare-dns-updater .

  all:
    desc: Run lint, tests, build, and docker
    cmds:
      - task: lint
      - task: golangci
      - task: test
      - task: build
      - task: docker
