version: "3"

tasks:
  run:
    desc: Run the DNS updater (dry-run with example config)
    cmds:
      - go run main.go --config {{.CLI_ARGS | default "config.yaml.example"}}

  build:
    desc: Build the Go binary
    cmds:
      - go build -o updater main.go

  test:
    desc: Run tests
    cmds:
      - go test -count=1 .

  testv:
    desc: Run tests verbose
    cmds:
      - go test -v -count=1 .

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  docker:
    desc: Build Docker image
    cmds:
      - docker build -t cloudflare-dns-updater .

  all:
    desc: Run vet, tests, and build
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: docker
